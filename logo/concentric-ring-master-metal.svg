<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Concentric Ring — Master Metal</title>
  <desc>Primary brand mark built from precisely aligned concentric rings with a restrained graphite-metal finish. Transparent background.</desc>
  <defs>
    <linearGradient id="metal" x1="126" y1="112" x2="390" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080808"/>
      <stop offset="0.18" stop-color="#858585"/>
      <stop offset="0.34" stop-color="#252525"/>
      <stop offset="0.62" stop-color="#050505"/>
      <stop offset="0.82" stop-color="#626262"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="innerMetal" x1="174" y1="148" x2="340" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555555"/>
      <stop offset="0.38" stop-color="#111111"/>
      <stop offset="0.72" stop-color="#3D3D3D"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="highlight" x1="158" y1="132" x2="356" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Every circular element shares the exact center: 256, 256. -->
  <circle cx="256" cy="256" r="155" stroke="#111111" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="140" stroke="url(#metal)" stroke-width="19"/>
  <circle cx="256" cy="256" r="140" stroke="url(#highlight)" stroke-width="2"/>
  <circle cx="256" cy="256" r="124" stroke="url(#innerMetal)" stroke-width="4"/>
  <circle cx="256" cy="256" r="113" stroke="#111111" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>

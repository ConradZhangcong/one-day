<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>One Day · 交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --card: #fff;
        --ink: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        --soft: #f4f4f5;
        --accent: #18181b;
        --on-accent: #fff;
        --red: #b42318;
        --red-bg: #fff1f0;
        --amber: #975d12;
        --amber-bg: #fff8e6;
        --blue: #365da8;
        --blue-bg: #eff5ff;
        font-family: Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #151517;
        --card: #202023;
        --ink: #f4f4f5;
        --muted: #a1a1aa;
        --line: #36363b;
        --soft: #2b2b30;
        --accent: #f4f4f5;
        --on-accent: #18181b;
        --red: #fda29b;
        --red-bg: #3b2427;
        --amber: #f1c675;
        --amber-bg: #352e22;
        --blue: #a6c3ff;
        --blue-bg: #242d40;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button,
      input,
      select,
      textarea {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
      }
      button {
        padding: 8px 12px;
        min-height: 38px;
      }
      button:hover {
        background: var(--soft);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      input,
      select,
      textarea {
        padding: 9px 10px;
        min-width: 0;
        width: 100%;
      }
      textarea {
        resize: vertical;
      }
      input[type='checkbox'] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 15px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .primary:hover {
        opacity: 0.88;
        background: var(--accent);
      }
      .ghost {
        background: transparent;
        border-color: transparent;
      }
      .danger {
        color: var(--red);
      }
      .layout {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100dvh;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100dvh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px 14px;
        border-right: 1px solid var(--line);
        background: var(--card);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px;
        font-size: 19px;
        font-weight: 750;
      }
      .brand img {
        width: 28px;
        height: 28px;
      }
      .brand button {
        margin-left: auto;
      }
      .nav {
        display: grid;
        gap: 4px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        border: 0;
        background: transparent;
      }
      .nav button[aria-current='page'] {
        background: var(--soft);
        font-weight: 700;
      }
      .nav-icon {
        width: 22px;
        text-align: center;
        font-size: 19px;
      }
      .count {
        margin-left: auto;
        background: var(--soft);
        border-radius: 5px;
        padding: 0 5px;
        font-size: 12px;
        color: var(--muted);
      }
      .nav-heading {
        padding: 16px 12px 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 12px 8px 0;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      main {
        min-width: 0;
        max-width: 1400px;
        width: 100%;
        margin: auto;
        padding: 32px 40px 56px;
        align-self: start;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 26px;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 5px;
      }
      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .prototype-label {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 3px 7px;
        border-radius: 5px;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      .quick {
        display: flex;
        gap: 8px;
        padding: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .quick input {
        border: 0;
        background: transparent;
      }
      .quick button {
        flex-shrink: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .toolbar .search {
        max-width: 280px;
      }
      .filter-panel {
        padding: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .filter-panel label,
      .field {
        display: grid;
        gap: 5px;
        font-size: 12px;
        color: var(--muted);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip,
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 5px;
        font-size: 11px;
        padding: 3px 7px;
        background: var(--soft);
        color: var(--muted);
      }
      .badge.overdue {
        background: var(--red-bg);
        color: var(--red);
      }
      .badge.missed {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .badge.repeat {
        background: var(--blue-bg);
        color: var(--blue);
      }
      .badge.done {
        color: var(--ink);
      }
      .task-list {
        display: grid;
        gap: 8px;
      }
      .task {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }
      .task.overdue {
        border-left: 3px solid var(--red);
      }
      .task.missed {
        border-left: 3px solid var(--amber);
      }
      .task-check {
        width: 28px;
        height: 28px;
        min-height: 28px;
        flex-shrink: 0;
        border-radius: 50%;
        padding: 0;
        font-size: 15px;
      }
      .task-copy {
        min-width: 0;
        flex: 1;
        display: grid;
        gap: 5px;
      }
      .task-title {
        text-align: left;
        padding: 0;
        border: 0;
        background: transparent;
        min-height: 24px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .task-title:hover {
        background: transparent;
        text-decoration: underline;
      }
      .task-meta {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .task-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .task-actions button {
        font-size: 12px;
      }
      .task.completed .task-title {
        color: var(--muted);
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .section-title small {
        font-weight: 400;
      }
      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
      }
      .empty h2 {
        color: var(--ink);
        margin-bottom: 8px;
      }
      .empty button {
        margin-top: 14px;
      }
      .summary {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .summary strong {
        color: var(--ink);
      }
      .recovery-link {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: left;
        padding: 12px 16px;
        background: var(--amber-bg);
        border-color: transparent;
      }
      .segmented {
        display: flex;
        gap: 3px;
        padding: 3px;
        background: var(--soft);
        border-radius: 9px;
        max-width: 100%;
      }
      .segmented button {
        border: 0;
        background: transparent;
        min-height: 34px;
        padding: 6px 13px;
        white-space: nowrap;
      }
      .segmented button[aria-pressed='true'] {
        background: var(--card);
        box-shadow: 0 1px 3px #0001;
      }
      .calendar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .date-nav {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .date-nav input {
        width: 145px;
      }
      .agenda-day {
        display: grid;
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 20px;
      }
      .agenda-date {
        font-size: 13px;
        font-weight: 650;
        padding-top: 14px;
      }
      .week-scroll {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      .week-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(115px, 1fr));
        min-width: 805px;
      }
      .week-col {
        border-right: 1px solid var(--line);
        padding: 10px;
        min-height: 320px;
      }
      .week-col:last-child {
        border-right: 0;
      }
      .day-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .day-label button {
        border: 0;
        padding: 3px 8px;
      }
      .is-today {
        background: var(--accent) !important;
        color: var(--on-accent) !important;
        border-radius: 50%;
      }
      .calendar-item {
        display: grid;
        gap: 4px;
        width: 100%;
        text-align: left;
        margin-bottom: 6px;
        font-size: 12px;
        padding: 8px;
        background: var(--soft);
        border-color: transparent;
        overflow-wrap: anywhere;
      }
      .calendar-item small {
        font-size: 10px;
      }
      .calendar-item.deadline {
        border-left: 2px solid var(--red);
      }
      .calendar-item.future {
        border: 1px dashed var(--line);
      }
      .month {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .weekday {
        text-align: center;
        padding: 12px;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .month-cell {
        padding: 8px;
        min-height: 120px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        min-width: 0;
      }
      .month-cell.outside {
        background: var(--bg);
      }
      .month-date {
        padding: 2px 7px;
        min-height: 28px;
        border: 0;
        background: transparent;
        margin-bottom: 6px;
      }
      .month .calendar-item {
        font-size: 11px;
        padding: 4px;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .month .calendar-item small {
        display: none;
      }
      .month .more {
        padding: 2px 5px;
        min-height: 26px;
        font-size: 11px;
      }
      .timeline {
        display: grid;
        gap: 16px;
      }
      .time-slot {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 12px;
      }
      .time-slot time {
        padding-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .time-slot-items {
        display: grid;
        gap: 6px;
        border-left: 1px solid var(--line);
        padding-left: 14px;
      }
      .time-point {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .time-point small {
        display: block;
        margin-top: 4px;
      }
      .goals {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .goal {
        display: grid;
        gap: 12px;
      }
      .goal progress {
        width: 100%;
        height: 8px;
        accent-color: var(--accent);
      }
      .goal .goal-tasks {
        display: grid;
        gap: 4px;
      }
      .goal-tasks button {
        text-align: left;
        border: 0;
        font-size: 12px;
      }
      .metric {
        font-size: 30px;
        font-weight: 700;
      }
      .review-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .mobile-nav {
        display: none;
      }
      .collapsed {
        grid-template-columns: 76px minmax(0, 1fr);
      }
      .collapsed .sidebar {
        padding-inline: 10px;
      }
      .collapsed .nav-text,
      .collapsed .count,
      .collapsed .brand strong,
      .collapsed .nav-heading,
      .collapsed .sidebar-foot,
      .collapsed .side-add {
        display: none;
      }
      .collapsed .brand {
        padding: 0;
        flex-wrap: wrap;
        justify-content: center;
      }
      .collapsed .nav button {
        justify-content: center;
      }
      .notice {
        padding: 12px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: var(--red);
        font-size: 12px;
      }
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .dialog-form {
        display: grid;
        gap: 16px;
      }
      .dialog-form details {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .dialog-form summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 12px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      dialog {
        width: min(540px, calc(100% - 28px));
        max-height: calc(100dvh - 32px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 20px 70px #0003;
      }
      dialog::backdrop {
        background: #0006;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .dialog-head button {
        border: 0;
        font-size: 20px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 14px;
        font-size: 13px;
      }
      .detail-grid dt {
        color: var(--muted);
      }
      .detail-grid dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--ink);
        color: var(--card);
        padding: 12px 16px;
        border-radius: 10px;
        box-shadow: 0 8px 28px #0002;
        display: flex;
        gap: 12px;
        align-items: center;
        width: max-content;
        max-width: calc(100% - 28px);
      }
      .toast button {
        color: inherit;
        background: transparent;
        border-color: currentColor;
        padding: 3px 8px;
        min-height: 28px;
        white-space: nowrap;
      }
      .toast[hidden] {
        display: none;
      }
      .more-menu {
        display: grid;
        gap: 8px;
      }
      .more-menu button {
        text-align: left;
      }
      .prototype-note {
        font-size: 11px;
        color: var(--muted);
        margin-top: 28px;
      }
      .mobile-month-count {
        display: none;
      }
      @media (max-width: 1000px) {
        main {
          padding: 26px 24px;
        }
        .layout {
          grid-template-columns: 200px minmax(0, 1fr);
        }
        .collapsed {
          grid-template-columns: 76px minmax(0, 1fr);
        }
        .task-actions {
          flex-basis: 100%;
          padding-left: 40px;
        }
        .task {
          flex-wrap: wrap;
        }
        .goals {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 720px) {
        .layout,
        .layout.collapsed {
          display: block;
        }
        .sidebar {
          display: none;
        }
        main {
          padding: 22px 16px 110px;
        }
        .topbar {
          margin-bottom: 20px;
        }
        h1 {
          font-size: 25px;
        }
        .top-actions .desktop-add {
          display: none;
        }
        .prototype-label {
          font-size: 10px;
        }
        .mobile-nav {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          position: fixed;
          inset: auto 0 0;
          z-index: 30;
          background: var(--card);
          border-top: 1px solid var(--line);
          padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
        }
        .mobile-nav button {
          border: 0;
          background: transparent;
          display: grid;
          justify-items: center;
          gap: 3px;
          padding: 4px;
          min-height: 46px;
          font-size: 11px;
        }
        .mobile-nav button[aria-current='page'] {
          font-weight: 700;
          background: var(--soft);
        }
        .mobile-nav .nav-icon {
          font-size: 19px;
        }
        .quick {
          flex-wrap: wrap;
        }
        .quick input {
          flex-basis: calc(100% - 72px);
          width: 0;
          flex-grow: 1;
        }
        .quick .date-shortcut {
          width: 100%;
          text-align: left;
          order: 3;
          font-size: 12px;
        }
        .filter-panel {
          grid-template-columns: 1fr;
        }
        .toolbar .search {
          max-width: none;
          flex: 1;
          width: 0;
        }
        .card {
          padding: 16px;
        }
        .task {
          padding: 13px;
          gap: 10px;
        }
        .task-actions {
          padding-left: 38px;
        }
        .agenda-day {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .agenda-date {
          padding: 0;
        }
        .date-nav {
          width: 100%;
          justify-content: space-between;
        }
        .date-nav input {
          flex: 1;
          width: 0;
        }
        .calendar-head h2 {
          font-size: 15px;
        }
        .month-cell {
          min-height: 70px;
          padding: 4px;
        }
        .month-cell .calendar-item {
          display: none;
        }
        .month-cell .more {
          display: none;
        }
        .mobile-month-count {
          display: block;
          font-size: 10px;
          color: var(--muted);
        }
        .weekday {
          padding: 8px 2px;
        }
        .month-date {
          padding: 2px 5px;
        }
        .summary {
          gap: 8px 12px;
        }
        .split {
          grid-template-columns: 1fr;
        }
        .review-stats {
          gap: 6px;
        }
        .review-stats .card {
          padding: 10px;
        }
        .review-stats h3 {
          font-size: 12px;
        }
        .metric {
          font-size: 25px;
        }
        .toast {
          bottom: calc(78px + env(safe-area-inset-bottom));
          font-size: 12px;
        }
        .time-point {
          font-size: 11px;
          left: 8px;
        }
        .dialog-actions {
          position: sticky;
          bottom: -24px;
          background: var(--card);
          padding-bottom: 12px;
        }
        dialog {
          padding: 20px;
        }
        .top-actions {
          gap: 5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout" id="layout">
      <aside class="sidebar" aria-label="主要导航">
        <div class="brand">
          <img src="../logo/concentric-ring-master-metal.svg" alt="" /><strong
            >One Day</strong

    <script>
      const TODAY = '2026-09-09',
        NOW = '2026-09-09T12:00';
      const $ = (s) => document.querySelector(s);
      const escapeHtml = (value) =>
        String(value ?? '').replace(
          /[&<>"']/g,
          (c) =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const dateOf = (value) => (value ? value.slice(0, 10) : '');
      function addDays(date, n) {
        const d = new Date(date + 'T12:00:00Z');
        d.setUTCDate(d.getUTCDate() + n);
        return d.toISOString().slice(0, 10);
      }
      function weekday(date) {
        return new Intl.DateTimeFormat('zh-CN', {
          weekday: 'short',
          timeZone: 'UTC',
        }).format(new Date(date + 'T12:00:00Z'));
      }
      function shortDate(date) {
        return `${Number(date.slice(5, 7))}月${Number(date.slice(8, 10))}日`;
      }
      function formatTime(value) {
        if (!value) return '未安排';
        const day = dateOf(value);
        const relative =
          day === TODAY
            ? '今天'
            : day === addDays(TODAY, 1)
              ? '明天'
              : day === addDays(TODAY, -1)
                ? '昨天'
                : shortDate(day);
        return `${relative} ${value.includes('T') ? value.slice(11, 16) : '全天'}`;
      }
      function past(value) {
        return value && (value.includes('T') ? value < NOW : value < TODAY);
      }
      function status(task) {
        if (task.state !== 'pending') return task.state;
        if (past(task.deadline)) return 'overdue';
        if (past(task.plan)) return 'missed';
        return 'pending';
      }
      const stateCopy = {
        pending: '待处理',
        completed: '已完成',
        skipped: '已跳过',

      let tasks = [

      ];
      let page = 'today',

      const navItems = [

      function recoveryTasks() {

      function navButton(key, label, icon) {

          key === 'recovery'

      }
      function go(next) {
        page = next;
        filters = { q: '', list: '', priority: '', state: '' };
        showFilters = false;
        render();
        window.scrollTo(0, 0);
      }
      function render() {
        renderNav();
        $('#page-title').textContent = page.startsWith('list:')
          ? page.slice(5)
          : navItems.find((x) => x[0] === page)?.[1] || '今天';

          page === 'calendar'
            ? calendarPage()
            : page === 'goals'
              ? goalsPage()
              : page === 'settings'
                ? settingsPage()
                : page === 'review'
                  ? reviewPage()
                  : listPage();
      }
      function selected(value, current) {
        return value === current ? 'selected' : '';
      }
      function filterControls() {
        const active = Object.values(filters).filter(Boolean).length;
        return `<div class="toolbar"><input class="search" id="search" type="search" placeholder="搜索标题或备注" aria-label="搜索任务" value="${escapeHtml(filters.q)}"><button data-action="filters" aria-expanded="${showFilters}">筛选${active ? ` · ${active}` : ''}</button>${active ? '<button class="ghost" data-action="clear">清除筛选</button>' : ''}</div>${showFilters ? `<div class="filter-panel"><label>清单<select data-filter="list"><option value="">全部清单</option>${lists.map((l) => `<option ${selected(l, filters.list)}>${l}</option>`).join('')}</select></label><label>优先级<select data-filter="priority"><option value="">全部优先级</option>${['无', '低', '中', '高'].map((x) => `<option ${selected(x, filters.priority)}>${x}</option>`).join('')}</select></label><label>状态<select data-filter="state"><option value="">${page === 'history' ? '全部已处理状态' : page === 'recovery' ? '全部待恢复状态' : '默认：待处理'}</option>${(page === 'recovery' ? ['overdue', 'missed'] : page === 'history' ? ['completed', 'skipped'] : ['all', 'pending', 'completed', 'skipped']).map((s) => `<option value="${s}" ${selected(s, filters.state)}>${s === 'all' ? '全部状态' : stateCopy[s]}</option>`).join('')}</select></label></div>` : ''}${
          active
            ? `<div class="chips">${Object.entries(filters)
                .filter(([, v]) => v)
                .map(
                  ([k, v]) =>
                    `<button class="chip" data-clear="${k}">${escapeHtml(k === 'q' ? '搜索：' + v : k === 'state' ? stateCopy[v] || '全部状态' : v)} ×</button>`,
                )
                .join('')}</div>`
            : ''
        }`;
      }
      function matches(t) {
        return (
          (!filters.q ||
            (t.title + ' ' + (t.notes || ''))
              .toLowerCase()
              .includes(filters.q.toLowerCase())) &&
          (!filters.list || t.list === filters.list) &&
          (!filters.priority || t.priority === filters.priority) &&
          (!filters.state ||
            filters.state === 'all' ||
            (page === 'recovery' ? status(t) : t.state) === filters.state)
        );
      }
      function ordered(items) {
        return [...items].sort(
          (a, b) =>
            (a.plan || a.deadline || '9999').localeCompare(
              b.plan || b.deadline || '9999',
            ) || a.id.localeCompare(b.id),
        );
      }
      function empty(message) {
        return `<div class="empty card"><h2>${message}</h2>${Object.values(filters).some(Boolean) ? '<p>试试减少条件，或清除全部筛选。</p><button data-action="clear">清除筛选</button>' : '<p>可以随时记录一件事，再决定什么时候做。</p><button data-action="new">＋ 添加任务</button>'}</div>`;
      }
      function taskRow(t, recover = false) {
        const s = status(t);
        return `<article class="task ${s}"><button class="task-check" data-complete="${t.id}" aria-label="${t.state === 'completed' ? '查看' : t.future ? '查看后续安排' : '完成'}${escapeHtml(t.title)}">${t.state === 'completed' ? '✓' : t.future ? '↻' : t.state === 'skipped' ? '–' : ''}</button><div class="task-copy"><button class="task-title" data-open="${t.id}">${escapeHtml(t.title)}</button><div class="task-meta">${t.plan ? `<span>计划 ${formatTime(t.plan)}</span>` : ''}${t.deadline ? `<span class="${past(t.deadline) && t.state === 'pending' ? 'danger' : ''}">${formatTime(t.deadline)} 截止</span>` : ''}${!t.plan && !t.deadline ? '<span>未安排日期</span>' : ''}</div><div class="task-meta"><span>${t.list}</span>${t.priority === '高' ? '<span class="badge missed">高优先级</span>' : ''}${['overdue', 'missed'].includes(s) ? `<span class="badge ${s}">${s === 'overdue' ? '!' : '◷'} ${stateCopy[s]}</span>` : ''}${t.repeat ? `<span class="badge repeat">↻ ${escapeHtml(t.repeat)} · ${t.future ? '后续安排' : t.state === 'pending' ? '当前待处理' : '已处理记录'}</span>` : ''}${t.state !== 'pending' ? `<span>${stateCopy[t.state]} · ${formatTime(t.completedAt)}</span>` : ''}${recover && s === 'overdue' && past(t.plan) ? '<span>计划也已错过</span>' : ''}</div></div>${recover ? `<div class="task-actions"><button data-skip="${t.id}">跳过${t.repeat ? '本次' : ''}</button><button class="primary" data-reschedule="${t.id}">${t.repeat ? '仅本次改期' : '重新安排'}</button></div>` : ''}</article>`;
      }
      function quickForm() {
        return `<form class="quick" id="quick-form"><input name="title" required aria-label="快速新增任务标题" placeholder="添加一件事，按 Enter 保存" autocomplete="off"><button type="submit" class="primary">添加</button><button type="button" class="date-shortcut ghost" data-action="new">日期与更多选项…</button></form>`;
      }
      function listPage() {
        let items = tasks.filter((t) =>
          page === 'recovery'
            ? ['overdue', 'missed'].includes(status(t)) && !t.future
            : page === 'history'
              ? t.state !== 'pending'
              : page === 'today'
                ? dateOf(t.plan) === TODAY || dateOf(t.deadline) === TODAY
                : page === 'inbox'
                  ? t.list === '收件箱'
                  : page === 'upcoming'
                    ? dateOf(t.plan) > TODAY || dateOf(t.deadline) > TODAY
                    : page.startsWith('list:')
                      ? t.list === page.slice(5)
                      : true,
        );
        if (!filters.state && !['history', 'recovery'].includes(page))
          items = items.filter((t) => t.state === 'pending');
        items = ordered(items.filter(matches));
        if (page === 'recovery')
          items.sort(
            (a, b) => Number(status(b) === 'overdue') - Number(status(a) === 'overdue'),
          );
        if (page === 'history')
          items.sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
        if (['inbox', 'upcoming'].includes(page)) {
          const seen = new Set();
          items = items.filter(
            (t) => !t.series || (!seen.has(t.series) && seen.add(t.series)),
          );
        }
        const recovery = recoveryTasks();
        const todayDone = tasks.filter(
          (t) => t.state === 'completed' && dateOf(t.completedAt) === TODAY && matches(t),
        );
        return `<div class="stack">${!['recovery', 'history'].includes(page) ? quickForm() : ''}${page === 'today' && recovery.length ? `<button class="recovery-link" data-page="recovery"><span>↺ ${recovery.length} 项待恢复 · 错过与逾期集中处理</span><span>查看 →</span></button>` : ''}${page === 'recovery' ? `<div class="summary"><strong>共 ${recovery.length} 项待恢复</strong><span>已逾期 ${recovery.filter((t) => status(t) === 'overdue').length} 项</span><span>错过计划 ${recovery.filter((t) => status(t) === 'missed').length} 项</span><span>逾期优先 · 原时间保留</span></div>` : ''}${filterControls()}<div class="section-title"><h2>${page === 'today' ? '今天的安排' : page === 'history' ? '处理记录' : page === 'recovery' ? '需要处理' : '任务'} <small>${items.length} 项</small></h2>${page === 'history' ? '<small>按实际处理时间排序</small>' : ''}</div><div class="task-list">${items.length ? items.map((t) => taskRow(t, page === 'recovery')).join('') : empty(page === 'recovery' ? '暂时没有需要恢复的任务' : '没有符合条件的任务')}</div>${page === 'today' && !filters.state ? `<details><summary>今天完成 · ${todayDone.length} 项</summary><div class="task-list" style="margin-top:12px">${todayDone.map((t) => taskRow(t)).join('') || '<p class="muted">完成后会在这里留下记录，包括今天补做的任务。</p>'}</div></details>` : ''}</div>`;

          tasks.filter(
            (t) =>

              matches(t) &&

      function calendarItem(t) {
        return `<button class="calendar-item ${!t.plan ? 'deadline' : ''} ${t.future ? 'future' : ''}" data-open="${t.id}"><span>${escapeHtml(t.title)}</span><small>${t.plan ? formatTime(t.plan) : formatTime(t.deadline) + ' 前截止'}${t.plan && t.deadline ? '<br>' + formatTime(t.deadline) + ' 前截止' : ''}${t.future ? '<br>↻ 后续安排 · 只读' : ''}</small></button>`;

        } else if (view === 'week') {
          const start = weekStart(anchor);
          body = `<p class="muted">按日期与时间排序；数量为当前筛选下的计划事项。横向滑动查看完整一周。</p><div class="week-scroll"><div class="week-grid">${Array.from(
            { length: 7 },

              const d = addDays(start, i),

            },
          ).join('')}</div></div>`;
        } else {
          const start = weekStart(anchor.slice(0, 8) + '01');
          body = `<div class="month">${['一', '二', '三', '四', '五', '六', '日'].map((d) => `<div class="weekday">${d}</div>`).join('')}${Array.from(
            { length: 42 },
            (_, i) => {
              const d = addDays(start, i),
                items = dateItems(d);
              return `<div class="month-cell ${d.slice(0, 7) !== anchor.slice(0, 7) ? 'outside' : ''}"><button class="month-date ${d === TODAY ? 'is-today' : ''}" data-day="${d}" aria-label="查看${d}">${Number(d.slice(8))}</button>${items.slice(0, 3).map(calendarItem).join('')}${items.length > 3 ? `<button class="more" data-day="${d}">+${items.length - 3} 项</button>` : ''}${items.length ? `<button class="mobile-month-count ghost" data-day="${d}" aria-label="查看${d}的${items.length}项安排">${items.length} 项</button>` : ''}</div>`;
            },
          ).join('')}</div>`;
        }
        const rangeLabel =
          view === 'month'
            ? `${anchor.slice(0, 4)} 年 ${Number(anchor.slice(5, 7))} 月`
            : view === 'week'
              ? `${shortDate(weekStart(anchor))} — ${shortDate(addDays(weekStart(anchor), 6))}`
              : view === 'agenda'
                ? `${shortDate(anchor)} — ${shortDate(addDays(anchor, 13))}`
                : `${shortDate(anchor)} · ${weekday(anchor)}`;
        return `<div class="stack"><h2>${rangeLabel}</h2><div class="calendar-head"><div class="segmented" aria-label="日历视图">${[
          ['agenda', '议程'],
          ['day', '日'],
          ['week', '周'],
          ['month', '月'],
        ]
          .map(
            ([v, l]) =>
              `<button data-view="${v}" aria-pressed="${v === view}">${l}</button>`,
          )
          .join(
            '',
          )}</div><button data-action="new">＋ 在 ${shortDate(anchor)} 添加</button><div class="date-nav"><button data-shift="-1" aria-label="上一范围">‹</button><input id="calendar-date" type="date" value="${anchor}" aria-label="日历日期"><button data-action="calendar-today">今天</button><button data-shift="1" aria-label="下一范围">›</button></div></div>${filterControls()}${view === 'agenda' && recoveryTasks().length ? `<button class="recovery-link" data-page="recovery">另有 ${recoveryTasks().length} 项待恢复 · 查看全部 →</button>` : ''}${body}</div>`;
      }
      function goalsPage() {
        return `<div class="stack"><div class="section-title"><small>目标状态由你决定，任务完成率自动计算。</small><button data-action="new-goal">＋ 新建目标</button></div><div class="goals">${goals
          .map((g) => {
            const linked = tasks.filter((t) => t.goal === g.id && !t.repeat),
              done = linked.filter((t) => t.state === 'completed').length,
              percent = linked.length ? Math.round((done / linked.length) * 100) : 0;
            return `<article class="card goal"><div class="row between"><h2>${escapeHtml(g.title)}</h2><span class="badge">${g.state}</span></div><p class="muted">${escapeHtml(g.description)}</p><progress value="${percent}" max="100" aria-label="${escapeHtml(g.title)}任务完成率"></progress><div class="row between"><small>${done} / ${linked.length} 个任务完成</small><strong>${percent}%</strong></div><div class="goal-tasks">${
              linked
                .slice(0, 3)
                .map(
                  (t) =>
                    `<button data-open="${t.id}">${t.state === 'completed' ? '✓' : '○'} ${escapeHtml(t.title)}</button>`,
                )
                .join('') || '<small>添加第一件事，让目标开始前进。</small>'
            }</div>${
              linked.length > 3
                ? `<details><summary>其余 ${linked.length - 3} 项</summary><div class="goal-tasks">${linked
                    .slice(3)
                    .map(
                      (t) =>
                        `<button data-open="${t.id}">${escapeHtml(t.title)}</button>`,
                    )
                    .join('')}</div></details>`
                : ''
            }<div class="row">${g.state !== '已归档' ? `<button data-goal-add="${g.id}">＋ 添加关联任务</button>` : ''}<button class="ghost" data-goal-edit="${g.id}">编辑目标</button></div></article>`;
          })
          .join('')}</div></div>`;
      }
      function reviewPage() {
        const done = tasks.filter(
            (t) => t.state === 'completed' && dateOf(t.completedAt) === TODAY,
          ),
          skipped = tasks.filter(
            (t) => t.state === 'skipped' && dateOf(t.completedAt) === TODAY,
          );
        return `<div class="stack"><p class="muted">${shortDate(TODAY)} · 按实际处理时间回顾</p><div class="review-stats">${[
          ['已完成', done.length],
          ['已跳过', skipped.length],
          ['待恢复', recoveryTasks().length],
        ]
          .map(
            ([l, n]) =>
              `<div class="card"><h3>${l}</h3><div class="metric">${n}</div></div>`,
          )
          .join(
            '',
          )}</div><h2>今天完成</h2><div class="task-list">${done.map((t) => taskRow(t)).join('') || empty('今天还没有完成记录')}</div><button data-page="history">查看全部处理记录 →</button></div>`;
      }
      function settingsPage() {
        return `<div class="stack"><section class="card stack"><h2>提醒与时区</h2><p class="muted">应用时区：Asia/Shanghai</p><p>页面可见且浏览器允许执行时提供提醒。关闭应用后不能保证准时送达。</p><div class="notice">原型不请求通知权限、不发送系统通知。正式应用中的全天默认时间和权限设置沿用现有实现。</div></section><section class="card stack"><h2>本地数据</h2><p>定期导出备份。恢复会替换全部本地数据，必须先预览并确认。</p><div class="row"><button data-info="备份导出使用正式应用的设置入口；本原型没有实际数据库。">导出备份流程说明</button><button data-info="恢复前先验证文件，再展示分类数量与时区，确认后原子替换；失败保留原数据。">恢复流程说明</button></div><div class="notice">清空数据属于独立危险操作，正式应用需二次确认。原型不提供对实际数据的清空操作。</div></section></div>`;
      }
      function showToast(message, action) {
        clearTimeout(toastTimer);
        $('#toast').innerHTML =
          `<span>${escapeHtml(message)}</span>${action ? `<button data-open="${action}">查看任务</button>` : ''}`;
        $('#toast').hidden = false;
        toastTimer = setTimeout(() => ($('#toast').hidden = true), 8000);
      }
      function modal(title, body) {
        if (!$('#modal').open) returnFocus = document.activeElement;
        $('#modal').innerHTML =
          `<div class="dialog-head"><h2 id="modal-title">${escapeHtml(title)}</h2><button data-action="close" aria-label="关闭弹窗">×</button></div>${body}`;
        if (!$('#modal').open) $('#modal').showModal();
        $('#modal').querySelector('[autofocus], button')?.focus();
      }
      $('#modal').addEventListener('close', () => {
        if (returnFocus?.isConnected) returnFocus.focus();
        else $('#page-title').focus();
      });
      function timeFields(prefix, value, label) {
        const timed = value.includes('T');
        return `<fieldset style="border:0;padding:0;margin:0;display:grid;gap:8px"><legend style="font-size:12px;color:var(--muted);margin-bottom:6px">${label}</legend><div class="split"><label class="field">日期<input type="date" name="${prefix}Date" value="${dateOf(value)}"></label><label class="field">具体时间（留空为全天）<input type="time" name="${prefix}Time" value="${timed ? value.slice(11) : ''}"></label></div></fieldset>`;
      }
      function taskForm(task, goal) {
        const editing = !!task;
        const defaultPlan = task ? task.plan : page === 'calendar' ? anchor : '';
        const list = task?.list || (page.startsWith('list:') ? page.slice(5) : '收件箱');
        modal(
          editing ? (task.repeat ? '仅本次改期' : '编辑任务') : '添加一件事',
          `<form id="task-form" class="dialog-form" data-id="${task?.id || ''}"><label class="field">任务标题<input name="title" required autofocus value="${escapeHtml(task?.title || '')}" ${task?.repeat ? 'readonly' : ''} placeholder="例如：给妈妈打电话"></label>${task?.repeat ? '<div class="notice">仅修改本次计划与截止，保留原具体时间。固定重复周期不变。</div>' : ''}${timeFields('plan', defaultPlan, '计划执行')}${timeFields('deadline', task?.deadline || '', '截止时间')}<div class="row"><button type="button" data-plan-day="${TODAY}">计划今天</button><button type="button" data-plan-day="${addDays(TODAY, 1)}">计划明天</button><button type="button" data-action="clear-plan">清除计划</button></div><details ${goal || editing ? 'open' : ''}><summary>清单、优先级与更多选项</summary><div class="stack"><div class="split"><label class="field">清单<select name="list" ${task?.repeat ? 'disabled' : ''}>${lists.map((l) => `<option ${selected(l, list)}>${l}</option>`).join('')}</select></label><label class="field">优先级<select name="priority" ${task?.repeat ? 'disabled' : ''}>${['无', '低', '中', '高'].map((l) => `<option ${selected(l, task?.priority || '无')}>${l}</option>`).join('')}</select></label></div><label class="field">关联长期目标<select name="goal" ${task?.repeat ? 'disabled' : ''}><option value="">不关联</option>${goals
            .filter((g) => g.state !== '已归档' || g.id === task?.goal)
            .map(
              (g) =>
                `<option value="${g.id}" ${selected(g.id, task?.goal || goal)}>${escapeHtml(g.title)}</option>`,
            )
            .join(
              '',
            )}</select></label><label class="field">备注<textarea name="notes" rows="2" ${task?.repeat ? 'readonly' : ''}>${escapeHtml(task?.notes || '')}</textarea></label></div></details><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">${editing ? '保存修改' : '添加任务'}</button></div></form>`,
        );
      }
      function openTask(id) {
        const t = tasks.find((x) => x.id === id);
        if (!t) return;
        const s = status(t);
        modal(
          t.title,
          `<div class="stack"><div class="row"><span class="badge ${s}">${stateCopy[s]}</span>${t.repeat ? `<span class="badge repeat">↻ ${escapeHtml(t.repeat)}</span>` : ''}</div>${t.future ? '<div class="notice">这是后续安排，暂不能完成或单次改期。需要调整周期时，请管理整个系列。</div>' : ''}<dl class="detail-grid"><dt>计划执行</dt><dd>${formatTime(t.plan)}</dd><dt>截止时间</dt><dd>${formatTime(t.deadline)}</dd><dt>清单</dt><dd>${t.list}</dd><dt>优先级</dt><dd>${t.priority}</dd>${t.goal ? '<dt>长期目标</dt><dd>' + escapeHtml(goals.find((g) => g.id === t.goal)?.title) + '</dd>' : ''}<dt>备注</dt><dd>${escapeHtml(t.notes || '无')}</dd></dl>${t.state !== 'pending' ? `<p class="muted">${stateCopy[s]}于 ${formatTime(t.completedAt)}</p>` : ''}<div class="dialog-actions">${!t.future && t.state === 'pending' ? `<button data-skip="${id}">跳过${t.repeat ? '本次' : ''}</button><button data-reschedule="${id}">${t.repeat ? '仅本次改期' : '编辑 / 改期'}</button><button class="primary" data-complete="${id}">完成${t.repeat ? '本次' : ''}</button>` : t.future ? '<button data-info="系列编辑将统一展示规则预览、影响范围与确认。这一轮原型暂未模拟规则修改。">管理整个系列 · 流程说明</button>' : !t.repeat && t.state === 'completed' ? `<button data-undo="${id}">撤销完成</button>` : ''}</div></div>`,
        );
      }
      function processTask(id, state) {
        const t = tasks.find((x) => x.id === id);
        if (!t || t.future || t.state !== 'pending') return;
        t.state = state;
        t.completedAt = NOW;
        if (t.series) {
          const next = ordered(tasks.filter((x) => x.series === t.series && x.future))[0];
          if (next) next.future = false;
        }
        $('#modal').close();
        render();
        showToast(`${t.title} · ${stateCopy[state]}`, id);
      }
      function goalForm(id) {
        const g = goals.find((x) => x.id === id);
        modal(
          g ? '编辑长期目标' : '新建长期目标',
          `<form id="goal-form" data-id="${g?.id || ''}" class="dialog-form"><label class="field">目标名称<input name="title" value="${escapeHtml(g?.title || '')}" required autofocus></label><label class="field">说明<textarea name="description">${escapeHtml(g?.description || '')}</textarea></label><label class="field">目标状态<select name="state">${['计划中', '进行中', '已完成', '已归档'].map((s) => `<option ${selected(s, g?.state || '计划中')}>${s}</option>`).join('')}</select></label><p class="muted">状态由你决定，任务完成率单独计算。</p><div class="dialog-actions"><button type="button" data-action="close">取消</button><button type="submit" class="primary">保存目标</button></div></form>`,
        );
      }
      document.addEventListener('click', (event) => {
        const b = event.target.closest('button');
        if (!b) return;
        if (b.dataset.page) {
          $('#modal').close();
          go(b.dataset.page);
        } else if (b.dataset.open) openTask(b.dataset.open);
        else if (b.dataset.complete) {
          const t = tasks.find((t) => t.id === b.dataset.complete);
          if (t?.future || t?.state !== 'pending') openTask(t.id);
          else processTask(t.id, 'completed');
        } else if (b.dataset.skip) processTask(b.dataset.skip, 'skipped');
        else if (b.dataset.undo) {
          const t = tasks.find((t) => t.id === b.dataset.undo);
          t.state = 'pending';
          delete t.completedAt;
          $('#modal').close();
          render();
          showToast('已撤销完成', t.id);
        } else if (b.dataset.reschedule)
          taskForm(tasks.find((t) => t.id === b.dataset.reschedule));
        else if (b.dataset.goalAdd) taskForm(null, b.dataset.goalAdd);
        else if (b.dataset.goalEdit) goalForm(b.dataset.goalEdit);
        else if (b.dataset.view) {
          view = b.dataset.view;
          render();
        } else if (b.dataset.day) {
          anchor = b.dataset.day;
          view = 'day';
          render();
        } else if (b.dataset.shift) {
          if (view === 'month') {
            const d = new Date(anchor.slice(0, 7) + '-01T12:00:00Z');
            d.setUTCMonth(d.getUTCMonth() + Number(b.dataset.shift));
            anchor = d.toISOString().slice(0, 10);
          } else
            anchor = addDays(
              anchor,
              Number(b.dataset.shift) *
                (view === 'week' ? 7 : view === 'agenda' ? 14 : 1),
            );
          render();
        } else if (b.dataset.clear) {
          filters[b.dataset.clear] = '';
          render();
        } else if (b.dataset.planDay) {
          $('#task-form').elements.planDate.value = b.dataset.planDay;
        } else if (b.dataset.info) {
          modal(
            '流程说明',
            `<div class="stack"><p>${escapeHtml(b.dataset.info)}</p><button data-action="close">知道了</button></div>`,
          );
        } else {
          switch (b.dataset.action) {
            case 'new':
              taskForm();
              break;
            case 'new-goal':
              goalForm();
              break;
            case 'close':
              $('#modal').close();
              break;
            case 'filters':
              showFilters = !showFilters;
              render();
              break;
            case 'clear':
              filters = { q: '', list: '', priority: '', state: '' };
              render();
              break;
            case 'calendar-today':
              anchor = TODAY;
              render();
              break;
            case 'clear-plan':
              $('#task-form').elements.planDate.value = '';
              $('#task-form').elements.planTime.value = '';
              break;
            case 'more':
              modal(
                '更多',
                `<nav class="more-menu">${navItems
                  .slice(4)
                  .map((x) => navButton(...x))
                  .join('')}<h3>我的清单</h3>${lists
                  .slice(1)
                  .map((l) => navButton('list:' + l, l, '·'))
                  .join('')}</nav>`,
              );
              break;
          }
        }
      });
      function updateSearch(event) {
        if (event.target.id === 'search' && !event.isComposing) {
          const position = event.target.selectionStart;
          filters.q = event.target.value;
          render();
          $('#search').focus();
          try {
            $('#search').setSelectionRange(position, position);
          } catch {}
        }
      }
      document.addEventListener('input', updateSearch);
      document.addEventListener('compositionend', updateSearch);
      document.addEventListener('change', (event) => {
        if (event.target.dataset.filter) {
          filters[event.target.dataset.filter] = event.target.value;
          render();
        } else if (
          event.target.id === 'calendar-date' &&
          /^\d{4}-\d{2}-\d{2}$/.test(event.target.value)
        ) {
          anchor = event.target.value;
          render();
        }
      });
      document.addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);
        if (form.id === 'quick-form') {
          const title = String(data.get('title')).trim();
          if (!title) return;
          const id = 't' + crypto.randomUUID();
          tasks.push({
            id,
            title,
            list: page.startsWith('list:') ? page.slice(5) : '收件箱',
            plan: '',
            deadline: '',
            priority: '无',
            state: 'pending',
          });
          render();
          showToast('已添加，无日期任务可从收件箱或所属清单查看', id);
          $('#quick-form input')?.focus();
        } else if (form.id === 'task-form') {
          const old = tasks.find((t) => t.id === form.dataset.id);
          const title = String(data.get('title')).trim();
          if (!title) {
            $('#form-error').textContent = '请输入任务标题。';
            return;
          }
          const point = (p) =>
            data.get(p + 'Date')
              ? String(data.get(p + 'Date')) +
                (data.get(p + 'Time') ? 'T' + data.get(p + 'Time') : '')
              : '';
          const plan = point('plan'),
            deadline = point('deadline');
          if (
            (data.get('planTime') && !plan) ||
            (data.get('deadlineTime') && !deadline)
          ) {
            $('#form-error').textContent = '填写具体时间时，请同时选择日期。';
            return;
          }
          if (
            plan &&
            deadline &&
            (dateOf(deadline) < dateOf(plan) ||
              (plan.includes('T') && deadline.includes('T') && deadline < plan))
          ) {
            $('#form-error').textContent =
              '截止不能早于计划。请调整日期或时间，原任务尚未修改。';
            return;
          }
          const task = {
            ...(old || {}),
            id: old?.id || 't' + crypto.randomUUID(),
            title,
            plan,
            deadline,
            list: old?.repeat ? old.list : String(data.get('list')),
            priority: old?.repeat ? old.priority : String(data.get('priority')),
            notes: old?.repeat ? old.notes : String(data.get('notes')),
            goal: old?.repeat ? old.goal : String(data.get('goal') || ''),
            state: old?.state || 'pending',
          };
          if (old) tasks = tasks.map((t) => (t.id === old.id ? task : t));
          else tasks.push(task);
          $('#modal').close();
          render();
          showToast(old ? '修改已保存' : '任务已添加', task.id);
        } else if (form.id === 'goal-form') {
          const title = String(data.get('title')).trim();
          if (!title) return;
          const goal = {
            id: form.dataset.id || 'g' + crypto.randomUUID(),
            title,
            description: String(data.get('description')),
            state: String(data.get('state')),
          };
          const old = goals.find((g) => g.id === goal.id);
          if (old) goals = goals.map((g) => (g.id === goal.id ? goal : g));
          else goals.push(goal);
          $('#modal').close();
          render();
          showToast('目标已保存');
        }
      });
      $('#collapse').addEventListener('click', () => {
        const collapsed = $('#layout').classList.toggle('collapsed');
        $('#collapse').textContent = collapsed ? '›' : '‹';
        $('#collapse').setAttribute('aria-expanded', String(!collapsed));
        $('#collapse').setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');
      });
      $('#theme').addEventListener('click', () => {
        const dark = document.documentElement.classList.toggle('dark');
        $('#theme').setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      });
      $('#page-title').tabIndex = -1;
      render();
    </script>
  </body>
</html>
